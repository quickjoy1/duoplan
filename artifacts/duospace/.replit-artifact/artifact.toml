kind = "web"
previewPath = "/"
title = "DuoSpace"
description = "A shared Class 12 study and personal planning workspace for two trusted users, with live shared tasks, an academic planner, unified calendar, goals, habits, focus sessions, and in-app reminders."
version = "1.0.0"
id = "artifacts/duospace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20938

[services.development]
run = "pnpm --filter @workspace/duospace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duospace", "run", "build" ]
serve = "static"
publicDir = "artifacts/duospace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20938"
BASE_PATH = "/"
