openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DuoSpace shared study and personal planning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: workspace
  - name: tasks
  - name: calendar
  - name: academics
  - name: goals
  - name: habits
  - name: journal
  - name: focus
  - name: notifications
  - name: activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Check the current workspace session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: loginToWorkspace
      tags: [auth]
      summary: Validate the shared workspace password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceLoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid password
  /auth/logout:
    post:
      operationId: logoutOfWorkspace
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked
  /auth/change-password:
    post:
      operationId: changeWorkspacePassword
      tags: [auth]
      summary: Change the shared workspace password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePasswordChangeInput"
      responses:
        "204":
          description: Password changed and other sessions revoked
  /auth/revoke-sessions:
    post:
      operationId: revokeWorkspaceSessions
      tags: [auth]
      summary: Revoke every active workspace session
      responses:
        "204":
          description: All sessions revoked
  /auth/select-profile:
    post:
      operationId: selectProfile
      tags: [auth]
      summary: Select the active convenience profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSelectionInput"
      responses:
        "200":
          description: Selected profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /workspace/dashboard:
    get:
      operationId: getDashboard
      tags: [workspace]
      summary: Get dashboard data and workload overview
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /workspace/settings:
    get:
      operationId: getWorkspaceSettings
      tags: [workspace]
      summary: Read workspace settings and profiles
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
  /workspace/export:
    get:
      operationId: exportWorkspaceData
      tags: [workspace]
      summary: Download the authorized workspace data as JSON
      responses:
        "200":
          description: Workspace export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExport"
    patch:
      operationId: updateWorkspaceSettings
      tags: [workspace]
      summary: Update workspace settings or profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Search and filter shared tasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Not Started, In Progress, Completed, Cancelled]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: due
          schema:
            type: string
            enum: [today, upcoming, overdue, all]
      responses:
        "200":
          description: Matching tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a shared task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update or reschedule a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: List events in a date range
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventList"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Add a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
  /calendar-events/{eventId}:
    patch:
      operationId: updateCalendarEvent
      tags: [calendar]
      summary: Update or move a calendar event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      summary: Delete an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /subjects:
    get:
      operationId: listSubjects
      tags: [academics]
      summary: List configurable academic subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
    post:
      operationId: createSubject
      tags: [academics]
      summary: Add a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
  /subjects/{subjectId}:
    patch:
      operationId: updateSubject
      tags: [academics]
      summary: Update a subject
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [academics]
      summary: Remove a subject
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /chapters:
    get:
      operationId: listChapters
      tags: [academics]
      summary: List chapters and syllabus progress
      parameters:
        - in: query
          name: subjectId
          schema:
            type: string
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterList"
    post:
      operationId: createChapter
      tags: [academics]
      summary: Add an editable chapter or topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterInput"
      responses:
        "201":
          description: Created chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
  /chapters/{chapterId}:
    patch:
      operationId: updateChapter
      tags: [academics]
      summary: Update chapter progress or notes
      parameters:
        - in: path
          name: chapterId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterUpdate"
      responses:
        "200":
          description: Updated chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
    delete:
      operationId: deleteChapter
      tags: [academics]
      summary: Delete a chapter
      parameters:
        - in: path
          name: chapterId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List shared goals and progress
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a shared goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update goal progress
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits and check-in history
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitList"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
  /habits/{habitId}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - in: path
          name: habitId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - in: path
          name: habitId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /habits/{habitId}/check-ins:
    post:
      operationId: createHabitCheckIn
      tags: [habits]
      summary: Record today's habit check-in
      parameters:
        - in: path
          name: habitId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCheckInInput"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List journal entries shared inside this workspace
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryList"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Write a workspace-visible journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /journal-entries/{entryId}:
    patch:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update a journal entry
      parameters:
        - in: path
          name: entryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - in: path
          name: entryId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [focus]
      summary: List persisted focus sessions and totals
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Focus sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionList"
    post:
      operationId: createFocusSession
      tags: [focus]
      summary: Start or record a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /focus-sessions/{sessionId}:
    patch:
      operationId: updateFocusSession
      tags: [focus]
      summary: Pause, resume, complete, or stop a focus session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionUpdate"
      responses:
        "200":
          description: Updated focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current in-app notifications
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark an in-app notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Read recent shared workspace activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
components:
  parameters:
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string }
        accent: { type: string }
      required: [id, name, avatar, accent]
    AuthSession:
      type: object
      properties:
        authenticated: { type: boolean }
        workspaceName: { type: string }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
        selectedProfileId: { type: ["string", "null"] }
      required: [authenticated, workspaceName, profiles, selectedProfileId]
    WorkspaceLoginInput:
      type: object
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
      required: [password]
    ProfileSelectionInput:
      type: object
      properties:
        profileId: { type: string }
      required: [profileId]
    WorkspacePasswordChangeInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
      required: [currentPassword, newPassword]
    WorkspaceSettings:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        theme: { type: string, enum: [dark, light, system] }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
        defaultTaskDuration: { type: integer }
        focusMinutes: { type: integer }
        shortBreakMinutes: { type: integer }
        longBreakMinutes: { type: integer }
      required: [name, timezone, theme, profiles, defaultTaskDuration, focusMinutes, shortBreakMinutes, longBreakMinutes]
    WorkspaceSettingsUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string }
        theme: { type: string, enum: [dark, light, system] }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
        defaultTaskDuration: { type: integer, minimum: 5, maximum: 600 }
        focusMinutes: { type: integer, minimum: 1, maximum: 180 }
        shortBreakMinutes: { type: integer, minimum: 1, maximum: 60 }
        longBreakMinutes: { type: integer, minimum: 1, maximum: 120 }
    WorkspaceExport:
      type: object
      properties:
        exportedAt: { type: string, format: date-time }
        workspace: { type: object, additionalProperties: true }
        profiles:
          type: array
          items: { type: object, additionalProperties: true }
        tasks:
          type: array
          items: { type: object, additionalProperties: true }
        calendarEvents:
          type: array
          items: { type: object, additionalProperties: true }
        subjects:
          type: array
          items: { type: object, additionalProperties: true }
        chapters:
          type: array
          items: { type: object, additionalProperties: true }
        goals:
          type: array
          items: { type: object, additionalProperties: true }
        habits:
          type: array
          items: { type: object, additionalProperties: true }
        habitLogs:
          type: array
          items: { type: object, additionalProperties: true }
        journalEntries:
          type: array
          items: { type: object, additionalProperties: true }
        focusSessions:
          type: array
          items: { type: object, additionalProperties: true }
        notifications:
          type: array
          items: { type: object, additionalProperties: true }
        activity:
          type: array
          items: { type: object, additionalProperties: true }
      required: [exportedAt, workspace, profiles, tasks, calendarEvents, subjects, chapters, goals, habits, habitLogs, journalEntries, focusSessions, notifications, activity]
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        category: { type: string }
        subjectId: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        priority: { type: string, enum: [Low, Medium, High, Urgent] }
        status: { type: string, enum: [Not Started, In Progress, Completed, Cancelled] }
        estimatedMinutes: { type: integer }
        actualMinutes: { type: ["integer", "null"] }
        assignedProfileId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        createdByProfileId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, category, priority, status, estimatedMinutes, tags, createdAt, updatedAt]
    TaskInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
        category: { type: string }
        subjectId: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        priority: { type: string, enum: [Low, Medium, High, Urgent] }
        status: { type: string, enum: [Not Started, In Progress, Completed, Cancelled] }
        estimatedMinutes: { type: integer, minimum: 0, maximum: 1440 }
        assignedProfileId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
      required: [title, category, priority, status, estimatedMinutes]
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
        category: { type: string }
        subjectId: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        priority: { type: string, enum: [Low, Medium, High, Urgent] }
        status: { type: string, enum: [Not Started, In Progress, Completed, Cancelled] }
        estimatedMinutes: { type: integer, minimum: 0, maximum: 1440 }
        actualMinutes: { type: ["integer", "null"] }
        assignedProfileId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
    TaskList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
      required: [items]
    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        category: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
        subjectId: { type: ["string", "null"] }
        profileId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, title, category, startAt, endAt, allDay, createdAt]
    CalendarEventInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
